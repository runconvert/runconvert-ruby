# Publishes to RubyGems when a version tag is pushed:
#   1. bump VERSION in lib/runconvert.rb and CHANGELOG.md, merge to main
#   2. gh release create v0.2.0 --target main   (or: git tag v0.2.0 && git push origin v0.2.0)
#   3. approve the "release" environment in the Actions tab
# Uses RubyGems trusted publishing (OIDC): no API key is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]
  # Started by release-please (release-please.yml) on the new tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby -Ilib test/test_unit.rb
      - name: The tag matches VERSION
        run: test "v$(ruby -Ilib -rrunconvert -e 'print RunConvert::VERSION')" = "$GITHUB_REF_NAME"
      - run: gem build runconvert.gemspec
      # Trusted publishing: swap GitHub's OIDC token for a 15-minute RubyGems key. Creating a new gem
      # also needs the owning RubyGems account ("owner"); the official actions don't pass it yet.
      - name: Get a short-lived RubyGems key
        run: |
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          echo "::add-mask::$jwt"
          res=$(curl -sS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jwt "$jwt" '{jwt: $jwt, owner: "runconvert"}')")
          key=$(echo "$res" | jq -r '.rubygems_api_key // empty')
          if [ -z "$key" ]; then echo "$res" | jq -c '.errors // .' ; exit 1; fi
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      - run: gem push runconvert-*.gem
